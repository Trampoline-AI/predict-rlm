[project]
name = "predict-rlm"
version = "0.6.1"
description = "Production-grade RLMs (Recursive Language Models) with tool use, built on DSPy"
authors = [{ name = "Trampoline AI" }]
license = { text = "MIT" }
requires-python = ">=3.11"
readme = "README.md"
keywords = ["rlm", "reasoning", "language-models", "dspy", "ai", "tool-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "deno>=2",
    "dspy>=3.1.2",
    "nest-asyncio>=1.6.0",
    "pydantic>=2.8.2,<3",
]

[project.urls]
Homepage = "https://www.trampoline.ai/"
Repository = "https://github.com/Trampoline-AI/predict-rlm"
Issues = "https://github.com/Trampoline-AI/predict-rlm/issues"

[project.optional-dependencies]
gepa = [
    "gepa>=0.0.26",
    "tqdm>=4.0.0",
]
codex-lm = [
    "litellm>=1.50",
    "openai>=1.60",
    "tenacity>=9.1.4",
]
gepa-viz = [
    "plotly>=5.0.0",
    "kaleido>=0.2.0",
]
examples = [
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
    "formulas>=1.2.0",
]

[project.scripts]
codex-lm = "dspy_codex_lm.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "pytest>=8.3.1,<9",
    "pytest-asyncio>=0.23.8,<0.24",
    "pytest-cov>=7.1.0",
    "pytest-testdox>=3.1.0,<4",
    "ruff>=0.11.5",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-s -rP --testdox"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require WASM sandbox)",
    "sbx: marks tests as Docker Sandboxes integration tests",
]

[tool.ruff]
lint.select = ["E", "F", "W", "I", "N"]
lint.ignore = ["E501"]
line-length = 96

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806"]

[tool.hatch.build.targets.sdist]
include = ["src/predict_rlm", "src/rlm_gepa", "src/codex-lm/dspy_codex_lm"]

[tool.hatch.build.targets.wheel]
include = ["src/predict_rlm", "src/rlm_gepa", "src/codex-lm/dspy_codex_lm"]

[tool.hatch.build.targets.wheel.sources]
"src/predict_rlm" = "predict_rlm"
"src/rlm_gepa" = "rlm_gepa"
"src/codex-lm/dspy_codex_lm" = "dspy_codex_lm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
