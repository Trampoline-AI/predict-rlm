[project]
name = "appworld-rlm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "predict-rlm[gepa,gepa-viz]",
]

[project.scripts]
rlm-gepa = "appworld_rlm.gepa:main"

[tool.uv.sources]
predict-rlm = { path = "../..", editable = true }

[tool.predict-rlm.generated]
predict_rlm_version = "0.4.1"
skill_version = "2.0"
layout = "agent-tools-bench-gepa"
features = ["agent", "tools", "bench", "rlm-gepa"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-testdox>=3.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["appworld_rlm"]
